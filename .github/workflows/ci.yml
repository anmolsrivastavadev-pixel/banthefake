name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Uses the runner's preinstalled Node (20+); the tests have no npm dependencies.
      - run: node --version
      - run: node --test extension/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen --group e2e
      - name: Install Chromium and its system dependencies
        run: uv run --frozen --group e2e playwright install --with-deps chromium
      - run: uv run --frozen --group e2e pytest -m e2e

  test-ml:
    runs-on: ubuntu-latest
    env:
      BTF_MODEL_ID: haywoodsloan/ai-image-detector-deploy
      BTF_MODEL_REVISION: 4ae1822603cb1ec980c217cfde1ef1b8e0477a16
      BTF_MODEL2_ID: buildborderless/CommunityForensics-DeepfakeDet-ViT
      BTF_MODEL2_REVISION: ac6ee457bea904a373065754107451793b56db00
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install ML dependencies with CPU-only Torch
        shell: bash
        run: |
          set -euo pipefail
          skip=(--no-install-package torch)
          while IFS= read -r package; do
            skip+=(--no-install-package "$package")
          done < <(sed -nE 's/^name = "((nvidia-|cuda-)[^"]+|triton)"$/\1/p' uv.lock)
          uv sync --frozen --extra ml "${skip[@]}"

          # Same hash-pinned CPU wheel as the Dockerfile (keep TORCH_CPU_VERSION and the hash in sync).
          torch_version=$(sed -n '/^name = "torch"$/{n;s/^version = "\(.*\)"$/\1/p;}' uv.lock)
          if [ "$torch_version" != "2.15.0" ]; then
            echo "uv.lock has torch $torch_version; update the pinned CPU wheel hash here and in the Dockerfile" >&2
            exit 1
          fi
          echo "torch==2.15.0+cpu --hash=sha256:0955c7e3446326293f48af18fad67872fa31dee5a36a87690eb9e5be8b465be3" > "$RUNNER_TEMP/torch-cpu.txt"
          uv pip install --python .venv/bin/python --no-deps --require-hashes \
            --index-url https://download.pytorch.org/whl/cpu -r "$RUNNER_TEMP/torch-cpu.txt"
          .venv/bin/python -c "import torch; assert not torch.cuda.is_available(); print('torch', torch.__version__)"
      - name: Cache detector weights (both models)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ runner.os }}-${{ env.BTF_MODEL_ID }}-${{ env.BTF_MODEL_REVISION }}-${{ env.BTF_MODEL2_ID }}-${{ env.BTF_MODEL2_REVISION }}
      - name: Prefetch both pinned detectors
        run: |
          .venv/bin/python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          for var in ("BTF_MODEL", "BTF_MODEL2"):
              snapshot_download(os.environ[var + "_ID"], revision=os.environ[var + "_REVISION"],
                                allow_patterns=["config.json", "preprocessor_config.json", "model.safetensors"])
          PY
      - run: uv run pytest -q -m ml
        env:
          UV_NO_SYNC: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: banthefake:ci
      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 8000:8000 banthefake:ci)
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..60}; do
            health=$(curl --fail --silent http://127.0.0.1:8000/api/health || true)
            if jq -e '.ok == true and .model == "loaded"' <<<"$health" >/dev/null 2>&1; then
              break
            fi
            if (( attempt == 60 )); then
              docker logs "$container"
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent \
            --form file=@tests/fixtures/ai_dalle_mars.jpg \
            http://127.0.0.1:8000/api/scan \
            | tee scan.json \
            | jq -e '.verdict == "ai" and .model.decision == "likely" and (.model.models | length) == 2' \
            || { cat scan.json; docker logs "$container"; exit 1; }
