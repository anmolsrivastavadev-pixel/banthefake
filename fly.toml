# Fly.io config for BanTheFake (the alternative deployment; see docs/DEPLOY.md, "Option B").
# Replace `app` and `primary_region` before the first deploy. Secrets (BTF_ADMIN_TOKEN) are set with
# `fly secrets set`, never here.

app = "banthefake-CHANGE-ME"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  BTF_DB_PATH = "/data/banthefake.db"
  # Two vCPUs: match torch's thread count to them.
  BTF_MODEL_THREADS = "2"
  # 4 GB profile: 2.5 GB model peak + one worker capped at 1 GB, with the remaining headroom kept small.
  BTF_SCAN_CONCURRENCY = "1"
  # Fly overwrites this edge header with the connecting client's address. The app validates it as one IP.
  BTF_CLIENT_IP_HEADER = "Fly-Client-IP"
  # Fly terminates TLS; emit HSTS from the app because there is no Caddy layer here.
  BTF_HSTS = "on"

# One volume, one Machine. The rate limiter and scan slots are in-memory, so never scale above 1.
[mounts]
  source = "btf_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep the Machine running: a cold start reloads ~840 MB of weights and the first scan waits for it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

# 2 shared vCPUs + 4 GB RAM, sized for BTF_SCAN_CONCURRENCY=1. For concurrency 2, use 8 GB as described
# in docs/DEPLOY.md. If `fly_instance_cpu_throttle` shows sustained throttling, switch to a dedicated CPU.
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
