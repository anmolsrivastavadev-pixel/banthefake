[project]
name = "banthefake"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "av>=19.0.2",
    "c2pa-python==0.38.1",  # 0.38.2 was published with macOS wheels only
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.15.0",
    "transformers>=5.22.1",
]
mcp = [
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
e2e = [
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ml: needs the ml extra (torch + transformers) and the detector weights",
    "e2e: browser end-to-end tests (uv run --group e2e pytest -m e2e); deselected by default",
]
# Browser tests need the e2e group and Chromium: keep them out of the default run (`-m e2e` overrides this).
addopts = ["-m", "not e2e"]
